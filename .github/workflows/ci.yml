# Checks formatting, lint, types, and tests on every push.
# Run the same locally before pushing:  pnpm check

name: CI

on: [push]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build
